name: QMS CI/CD Pipeline

on:
  push:
    branches: [ terraform ]
  workflow_dispatch: {}

env:
  AWS_ROLE_ARN: arn:aws:iam::120569648189:role/qms-app-github-role
  AWS_REGION: us-east-1
  AWS_ROLE_SESSION_NAME: GitHub_Deployer

permissions:
  id-token: write
  contents: read

jobs:
  compile_source:
    name: Compile Source Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pre-requisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip jq

      - name: Create Lambda Source ZIPs
        run: |
          set -euo pipefail
          SRC="src/app"
          if [ -d "$SRC" ]; then
            for d in "$SRC"/*/; do
              [ -d "$d" ] || continue
              base="$(basename "$d")"
              zipPath="$SRC/${base}.zip"
              rm -f "$zipPath"
              (cd "$d" && zip -qr "$PWD/../${base}.zip" .)
            done
          fi
          ls -la src/app/*.zip || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: src/ui/package-lock.json

      - name: Build Frontend
        working-directory: src/ui
        env:
          VITE_API_URL: development
        run: |
          npm install
          npm run build:dev
          ls -la dist || true

      - name: Upload Backend ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: backend-zips
          path: src/app/*.zip
          if-no-files-found: ignore

      - name: Upload Frontend Dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: src/ui/dist
          if-no-files-found: ignore

  deploy_terraform:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: compile_source
    outputs:
      ui_bucket: ${{ steps.tf_out.outputs.ui_bucket }}
    env:
      TF_INPUT: "false"
      TF_IN_AUTOMATION: "true"
      TFVARS_PATH: conf/dev/terraform.tfvars

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download backend zips
        uses: actions/download-artifact@v4
        with:
          name: backend-zips
          path: src/app
        continue-on-error: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name:  ${{ env.AWS_ROLE_SESSION_NAME }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Plan Terraform Changes
        run: terraform plan -input=false -var-file="conf/dev/terraform.tfvars" -out=tfplan

      - name: Apply Terraform Changes
        run: terraform apply -auto-approve tfplan

      - name: Export Website Bucket Name
        id: tf_out
        shell: bash
        run: |
          set -euo pipefail
          UI_BUCKET="$(terraform output -raw static_website_bucket_name)"
          echo "ui_bucket=${UI_BUCKET}" >> "$GITHUB_OUTPUT"

  deploy_frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy_terraform
    env:
      UI_BUCKET: ${{ needs.deploy_terraform.outputs.ui_bucket }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Frontend Dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: src/ui/dist
        continue-on-error: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name:  ${{ env.AWS_ROLE_SESSION_NAME }}

      - name: Upload to S3 (recursive)
        if: ${{ hashFiles('src/ui/dist/**') != '' && env.UI_BUCKET != '' }}
        run: aws s3 cp src/ui/dist "s3://${UI_BUCKET}/" --recursive