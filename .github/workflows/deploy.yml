name: QMS CI/CD Pipeline

on:
  push:
    branches: [ terraform ]
  workflow_dispatch: {}

env:
  AWS_ACCOUNT_ID: 120569648189
  AWS_ROLE_ARN: arn:aws:iam::120569648189:role/qms-app-github-role
  AWS_REGION: us-east-1
  AWS_ROLE_SESSION_NAME: GitHub_Deployer
  ENVIRONMENT: dev

permissions:
  id-token: write
  contents: read

jobs:
  build_docker_image_api:
    name: Build API Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pre-requisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip jq

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ env.AWS_ROLE_SESSION_NAME }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup ECR Repository
        run: |
          set -euo pipefail
          if ! aws ecr describe-repositories --repository-names "qms-${{ env.ENVIRONMENT }}-api" >/dev/null 2>&1; then
            aws ecr create-repository --repository-name "qms-${{ env.ENVIRONMENT }}-api" >/dev/null
            echo "Created ECR repository: qms-${{ env.ENVIRONMENT }}-api"
          else
            echo "ECR repository exists: qms-${{ env.ENVIRONMENT }}-api"
          fi

      - name: Setup Image Tags
        run: |
          echo "Registry: ${{ steps.ecr-login.outputs.registry }}"
          echo "Tag: ${{ steps.ecr-login.outputs.registry }}/qms-${{ env.ENVIRONMENT }}-api:latest"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./containers/api
          file: ./containers/api/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/qms-${{ env.ENVIRONMENT }}-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
  compile_backend:
    name: Compile Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pre-requisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip jq

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "src/app/**/requirements.txt"

      - name: Install Dependencies
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          set -euo pipefail
          SRC="src/app"
          if [ -d "$SRC" ]; then
            for d in "$SRC"/*/; do
              [ -d "$d" ] || continue
              if [ -f "${d}requirements.txt" ]; then
                echo "==> Installing deps for $(basename "$d")"
                python -m pip install -r "${d}requirements.txt" -t "$d"
                find "$d" -type d -name "__pycache__" -prune -exec rm -rf {} +
                find "$d" -type d -name "*.dist-info" -prune -exec rm -rf {} + || true
                find "$d" -type d -name "*.egg-info"  -prune -exec rm -rf {} + || true
                rm -rf "${d}tests" || true
              else
                echo "==> No requirements.txt in $(basename "$d"); skipping deps."
              fi
            done
          fi

      - name: Create Lambda Source ZIPs
        run: |
          set -euo pipefail
          SRC="src/app"
          if [ -d "$SRC" ]; then
            for d in "$SRC"/*/; do
              [ -d "$d" ] || continue
              base="$(basename "$d")"
              zipPath="$SRC/${base}.zip"
              rm -f "$zipPath"
              (cd "$d" && zip -qr "$PWD/../${base}.zip" .)
            done
          fi
          ls -la src/app/*.zip || true

      - name: Upload Backend ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: backend-zips
          path: src/app/*.zip
          if-no-files-found: ignore

  compile_frontend:
    name: Compile Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pre-requisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip jq

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: src/ui/package-lock.json

      - name: Build Frontend
        working-directory: src/ui
        env:
          VITE_API_URL: development
        run: |
          npm install
          npm run build:dev
          ls -la dist || true

      - name: Upload Frontend Dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: src/ui/dist
          if-no-files-found: ignore

  deploy_terraform:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [compile_frontend, compile_backend]
    outputs:
      ui_bucket: ${{ steps.tf_out.outputs.ui_bucket }}
      cf_dist_id: ${{ steps.tf_out.outputs.cf_dist_id }}
    env:
      TF_INPUT: "false"
      TF_IN_AUTOMATION: "true"
      TFVARS_PATH: conf/dev/terraform.tfvars

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download backend zips
        uses: actions/download-artifact@v4
        with:
          name: backend-zips
          path: src/app
        continue-on-error: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name:  ${{ env.AWS_ROLE_SESSION_NAME }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Plan Terraform Changes
        run: terraform plan -input=false -var-file="conf/dev/terraform.tfvars" -out=tfplan

      - name: Apply Terraform Changes
        run: terraform apply -auto-approve tfplan

      - name: Export Website Bucket Name
        id: tf_out
        shell: bash
        run: |
          set -euo pipefail
          UI_BUCKET="$(terraform output -raw static_website_bucket_name)"
          echo "ui_bucket=${UI_BUCKET}" >> "$GITHUB_OUTPUT"
          if terraform output -raw cloudfront_distribution_id >/dev/null 2>&1; then
            CF_DIST_ID="$(terraform output -raw cloudfront_distribution_id)"
            echo "cf_dist_id=${CF_DIST_ID}" >> "$GITHUB_OUTPUT"
          else
            echo "cf_dist_id=" >> "$GITHUB_OUTPUT"
          fi

  deploy_frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy_terraform
    env:
      UI_BUCKET: ${{ needs.deploy_terraform.outputs.ui_bucket }}
      CF_DIST_ID:  ${{ needs.deploy_terraform.outputs.cf_dist_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Frontend Dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: src/ui/dist
        continue-on-error: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name:  ${{ env.AWS_ROLE_SESSION_NAME }}

      - name: Upload to S3 Website Bucket
        if: ${{ hashFiles('src/ui/dist/**') != '' && env.UI_BUCKET != '' }}
        run: aws s3 cp src/ui/dist "s3://${UI_BUCKET}/" --recursive

      - name: Invalidate CloudFront
        if: ${{ env.CF_DIST_ID != '' }}
        run: |
          echo "Invalidating CloudFront distribution ${CF_DIST_ID}"
          aws cloudfront create-invalidation --distribution-id "${CF_DIST_ID}" --paths "/*"