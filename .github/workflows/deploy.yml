name: QMS CI/CD Pipeline

on:
  push:
    branches: ['**']
  workflow_dispatch: {} 

env:
  AWS_ACCOUNT_ID: 120569648189
  AWS_ROLE_ARN: arn:aws:iam::120569648189:role/qms-app-github-role
  AWS_REGION: us-east-1
  AWS_ROLE_SESSION_NAME: GitHub_Deployer
  ENVIRONMENT: dev

permissions:
  id-token: write
  contents: read
  pages: write

jobs:

  resolve_lambda_wheels:
    name: Resolve Lambda Wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download manylinux wheels for all functions
        env:
          PYDIGITS: "312"
          PLATFORM: "manylinux2014_x86_64"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wheelhouse
          find src/app -maxdepth 2 -name "requirements.txt" -print0 \
          | while IFS= read -r -d '' req; do
            echo "==> Resolving wheels for $req"
            pip download -r "$req" \
              --dest wheelhouse \
              --only-binary=:all: \
              --platform "$PLATFORM" \
              --implementation cp \
              --python-version "$PYDIGITS" \
              --abi "cp${PYDIGITS}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wheelhouse-py312-al2023-x86_64
          path: wheelhouse/
          if-no-files-found: error
          retention-days: 14

  test_backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: [resolve_lambda_wheels]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download wheelhouse
        uses: actions/download-artifact@v4
        with:
          name: wheelhouse-py312-al2023-x86_64
          path: wheelhouse

      - name: Install Test Dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          set -euo pipefail
          if [ -f "src/tests/requirements.txt" ]; then
            python -m pip install -r src/tests/requirements.txt
          else
            python -m pip install pytest pytest-cov moto boto3 freezegun requests-mock
          fi

          # Install each function's runtime deps from the same wheelhouse (AL2023-compatible)
          find src/app -maxdepth 2 -name "requirements.txt" -print0 | while IFS= read -r -d '' req; do
            echo "==> Installing runtime deps from $req (no build)"
            python -m pip install -r "$req" --no-index --find-links=wheelhouse
          done

      - name: Run Pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/src/app
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_SESSION_TOKEN: test
          AWS_DEFAULT_REGION: us-east-1
        run: pytest src/tests --cov=src/app --cov-report=term-missing --cov-report=html --cov-fail-under=40 -W ignore

      - name: Run Pylint
        run: |
          set -euo pipefail
          pylint src/app/ --disable=C0111 > pylint_report.txt || true
          SCORE=$(tail -n 2 pylint_report.txt | grep -o '[0-9]*\.[0-9]*/10' | awk -F '/' '{print $1}')
          if (( $(echo "$SCORE >= 6" | bc -l) )); then echo "✅ Pylint Passed (Score $SCORE)"; else echo "❌ Pylint Failed (Score $SCORE)"; exit 1; fi

      - name: Upload coverage HTML (htmlcov/)
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload pylint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pylint-report
          path: pylint_report.txt
          if-no-files-found: error
          retention-days: 14

  compile_backend:
    name: Compile Backend
    runs-on: ubuntu-latest
    needs: [resolve_lambda_wheels, test_backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pre-requisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip jq

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download wheelhouse
        uses: actions/download-artifact@v4
        with:
          name: wheelhouse-py312-al2023-x86_64
          path: wheelhouse

      - name: Install Dependencies into function folders (no-build)
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          set -euo pipefail
          SRC="src/app"
          if [ -d "$SRC" ]; then
            for d in "$SRC"/*/; do
              [ -d "$d" ] || continue
              if [ -f "${d}requirements.txt" ]; then
                echo "==> Installing deps for $(basename "$d")"
                python -m pip install -r "${d}requirements.txt" --no-index --find-links=wheelhouse -t "$d"
                # Copy shared utilities
                cp "${SRC}/audit_logger.py" "$d/" 2>/dev/null || true
                # Trim extras; keep wheels lean
                find "$d" -type d -name "__pycache__"    -prune -exec rm -rf {} +
                find "$d" -type d -name "*.dist-info"    -prune -exec rm -rf {} + || true
                find "$d" -type d -name "*.egg-info"     -prune -exec rm -rf {} + || true
                rm -rf "${d}tests" || true
                # Optional: boto3/botocore are in the runtime for Lambda
                rm -rf "${d}boto3" "${d}botocore" || true
              else
                echo "==> No requirements.txt in $(basename "$d"); skipping deps."
              fi
            done
          fi

      - name: Create Lambda Source ZIPs
        run: |
          set -euo pipefail
          SRC="src/app"
          if [ -d "$SRC" ]; then
            for d in "$SRC"/*/; do
              [ -d "$d" ] || continue
              base="$(basename "$d")"
              zipPath="$SRC/${base}.zip"
              rm -f "$zipPath"
              (cd "$d" && zip -qr "$PWD/../${base}.zip" .)
            done
          fi
          ls -la src/app/*.zip || true

      - name: Upload Backend ZIPs
        uses: actions/upload-artifact@v4
        with:
          name: backend-zips
          path: src/app/*.zip
          if-no-files-found: ignore
          retention-days: 14

  compile_frontend:
    name: Compile Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pre-requisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip jq

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: src/ui/package-lock.json

      - name: Build Frontend
        working-directory: src/ui
        env:
          VITE_API_URL: development
        run: |
          npm install
          VITE_CALLBACK_URL="${{ secrets.VITE_CALLBACK_URL }}" \
          VITE_AUTHORITY_URL="${{ secrets.VITE_AUTHORITY_URL }}" \
          VITE_CLIENT_ID="${{ secrets.VITE_CLIENT_ID }}" \
          VITE_TINYMCE_CDN="${{ secrets.VITE_TINYMCE_CDN }}" \
          npm run build:dev
          ls -la dist || true

      - name: Upload Frontend Dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: src/ui/dist
          if-no-files-found: ignore
          retention-days: 14

  scan_infra:
    name: Checkov Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkov Scan
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          python -m pip install "pycares>=4.9,<5.0"
          python -m pip install checkov
          checkov -d . --skip-path src/ --skip-path conf/ --quiet --check MEDIUM,HIGH,CRITICAL
          
  deploy_terraform:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [compile_backend, compile_frontend]
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'terraform')) }}
    outputs:
      ui_bucket: ${{ steps.tf_out.outputs.ui_bucket }}
      cf_dist_id: ${{ steps.tf_out.outputs.cf_dist_id }}
    env:
      TF_INPUT: "false"
      TF_IN_AUTOMATION: "true"
      TFVARS_PATH: conf/dev/terraform.tfvars

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download backend zips
        uses: actions/download-artifact@v4
        with:
          name: backend-zips
          path: src/app
        continue-on-error: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name:  ${{ env.AWS_ROLE_SESSION_NAME }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Plan Terraform Changes
        run: terraform plan -input=false -var-file="conf/dev/terraform.tfvars" -var "openam_client_secret=${{ secrets.OPENAM_CLIENT_SECRET }}" -var "openam_client_id=${{ secrets.OPENAM_CLIENT_ID }}" -var "openam_tenant_id=${{ secrets.OPENAM_TENANT_ID }}" -out=tfplan

      - name: Apply Terraform Changes
        run: terraform apply -auto-approve tfplan

      - name: Export Website Bucket Name
        id: tf_out
        shell: bash
        run: |
          set -euo pipefail
          UI_BUCKET="$(terraform output -raw static_website_bucket_name)"
          echo "ui_bucket=${UI_BUCKET}" >> "$GITHUB_OUTPUT"
          if terraform output -raw cloudfront_distribution_id >/dev/null 2>&1; then
            CF_DIST_ID="$(terraform output -raw cloudfront_distribution_id)"
            echo "cf_dist_id=${CF_DIST_ID}" >> "$GITHUB_OUTPUT"
          else
            echo "cf_dist_id=" >> "$GITHUB_OUTPUT"
          fi

  deploy_frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy_terraform
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'terraform')) }}
    env:
      UI_BUCKET: ${{ needs.deploy_terraform.outputs.ui_bucket }}
      CF_DIST_ID:  ${{ needs.deploy_terraform.outputs.cf_dist_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Frontend Dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: src/ui/dist
        continue-on-error: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name:  ${{ env.AWS_ROLE_SESSION_NAME }}

      - name: Upload to S3 Website Bucket
        if: ${{ hashFiles('src/ui/dist/**') != '' && env.UI_BUCKET != '' }}
        run: aws s3 cp src/ui/dist "s3://${UI_BUCKET}/" --recursive

      - name: Invalidate CloudFront
        if: ${{ env.CF_DIST_ID != '' }}
        run: |
          echo "Invalidating CloudFront distribution ${CF_DIST_ID}"
          aws cloudfront create-invalidation --distribution-id "${CF_DIST_ID}" --paths "/*"
