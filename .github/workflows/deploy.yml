name: QMS-AI Deployment Pipeline

on:
  push:
    branches: [ terraform ]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy QMS-AI
    runs-on: ubuntu-latest

    env:
      TF_INPUT: "false"
      TF_IN_AUTOMATION: "true"
      TFVARS_PATH: conf/dev/terraform.tfvars

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::120569648189:role/qms-app-github-role
          role-session-name: GitHub_Deployer
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Install Pre-requisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip jq

      - name: Compile Backend
        run: |
          set -euo pipefail
          SRC="src/app"
          if [ -d "$SRC" ]; then
            for d in "$SRC"/*/; do
              [ -d "$d" ] || continue
              base="$(basename "$d")"
              zipPath="$SRC/${base}.zip"
              rm -f "$zipPath"
              (cd "$d" && zip -qr "$PWD/../${base}.zip" .)
            done
          fi

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Plan Terraform Changes
        run: terraform plan -input=false -var-file="conf/dev/terraform.tfvars" -out=tfplan

      - name: Apply Terraform Changes
        run: terraform apply -auto-approve tfplan
      
      - name: Compile Frontend
        run: |
          cd src/ui
          npm run build:dev
