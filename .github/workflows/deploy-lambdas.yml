name: Deploy Lambdas

on:
  push:
    branches:
      - main

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # get main branch repo contents
      - name: Checkout code
        uses: actions/checkout@v3
        env:
          GITHUB_TOKEN: ${{ github.token }} 
      - uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::120569648189:role/qms-app-github-role
          role-session-name: samplerolesession
          aws-region: us-east-1

      - name: Deploy lambdas (zip & update function code)
        run: >-
          for dir in complaints-crl-mapping-dev complaints-errorness-check-dev complaints-fetch-results-dev complaints-inference-dev complaints-level-dev complaints-preload-narrative-dev complaints-priority-dev complaints-queue-narrative-dev complaints-subcategory-dev complaints-upload-final-results-dev complaints-upload-narrative-dev;
          do
            echo "########## Deploying ${dir}... ##########"
            cd ${dir}
            zip -j lambda1.zip ./src/*.py;
            aws lambda update-function-code --function-name=${dir}-dev --zip-file=fileb://lambda1.zip;
            cd ..
            echo "########## ${dir} done... ##########"
          done
