AWSTemplateFormatVersion: "2010-09-09"
Description: "Lambda state machine."
Parameters:
  Environment:
    Description: Environment for the bucket
    Type: String
    AllowedValues:
      - 'dev'
      - 'qa'
      - 'prod'

Resources:
  StatesExecutionRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - !Sub states.${AWS::Region}.amazonaws.com
            Action: "sts:AssumeRole"
      Path: "/"
      Policies:
        - PolicyName: StatesExecutionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "lambda:InvokeFunction"
                Resource: "*"

  StateMachine:
    Type: "AWS::StepFunctions::StateMachine"
    Properties:
      StateMachineName: !Sub complaints-${Environment}
      DefinitionString: !Sub |-
            {
              "StartAt": "execution",
              "States": {
                "execution": {
                  "Type": "Parallel",
                  "Branches": [
                    {
                      "StartAt": "Level",
                      "States": {
                        "Level": {
                          "Type": "Task",
                          "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:complaints-level-${Environment}",
                          "End": true
                        }
                      }
                    },
                    {
                      "StartAt": "sub-category",
                      "States": {
                        "sub-category": {
                          "Type": "Task",
                          "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:complaints-subcategory-${Environment}",
                          "End": true
                        }
                      }
                    }
                  ],
                  "Next": "CRL"
                },
                "CRL": {
                  "Type": "Task",
                  "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:complaints-crl-mapping-${Environment}",
                  "Next": "Priority"
                },
                "Priority": {
                  "Type": "Task",
                  "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:complaints-priority-${Environment}",
                  "End": true
                }
              },
              "TimeoutSeconds": 100
            }
      RoleArn: !GetAtt [ StatesExecutionRole, Arn ]