AWSTemplateFormatVersion: 2010-09-09
Description: "GitHub Action IAM Role"

Resources:
  iamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - repo:pwc-us-pt-innovationhub/product-complaint-ai-usecase:*
            Effect: Allow
            Principal:
              Federated:
                Fn::Join:
                  - ""
                  - - "arn:aws:iam::"
                    - Ref: AWS::AccountId
                    - :oidc-provider/token.actions.githubusercontent.com
        Version: "2012-10-17"
      Description: This role is used via GitHub Actions to deploy to this AWS account
      ManagedPolicyArns:
        - Fn::Join:
            - ""
            - - "arn:"
              - Ref: AWS::Partition
              - :iam::aws:policy/ReadOnlyAccess
      MaxSessionDuration: 3600
      Policies:
        - PolicyDocument:
            Statement:
              - Action:
                  - cloudformation:*
                  - lambda:*
                  - states:*
                  - apigateway:*
                  - dynamodb:*
                  - sagemaker:*
                  - sqs:*
                  - cloudfront:*
                  - waf:*
                  - wafv2:*
                  - iam:*
                  - s3:*
                Effect: Allow
                Resource: "*"
            Version: "2012-10-17"
          PolicyName: ComplaintsGitHubDeployRolePolicy
      RoleName: ComplaintsGitHubDeployRolePolicy
